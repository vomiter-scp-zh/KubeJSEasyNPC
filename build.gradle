plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { gameDirectory = project.file('run') }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.latvian.dev/releases'; content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' } }
    maven { url = 'https://maven.latvian.dev/mirror'; content { includeGroup 'com.github.rtyley' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "dev.latvian.mods:rhino:${rhino_version}"
    implementation "maven.modrinth:easy-npc-core:${easy_npc_core_version_id}"
    runtimeOnly "maven.modrinth:easy-npc-config-ui:${easy_npc_ui_version_id}"
    runtimeOnly "maven.modrinth:probejs:${probejs_version_id}"
}
tasks.named('processResources', ProcessResources).configure {
    def properties = [minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        kubejs_version: kubejs_version, easy_npc_version: easy_npc_version]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand properties }
}
tasks.named('jar', Jar).configure {
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': mod_authors,
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': mod_version,
        'Implementation-Vendor': mod_authors]) }
}
publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar; artifact sourcesJar } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
